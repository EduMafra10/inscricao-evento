<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no evento</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Inscrição no evento</h1>
        <p>Preencha seus dados e selecione sua cidade para participar.</p>

        <form id="formulario">
            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required disabled>
                    <option value="">Carregando estados...</option>
                </select>
            </div>

            <div class="campo">
                <label for="filtro">Buscar cidade</label>
                <input
                    type="text"
                    id="filtro"
                    placeholder="Digite para filtrar as cidades"
                    disabled
                >
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <select id="cidade" name="cidade" required disabled>
                    <option value="">Escolha um estado primeiro</option>
                </select>
            </div>

            <button type="submit" id="botao-inscrever" disabled>
                Inscrever
            </button>
        </form>

        <p id="total-cidades" role="status"></p>
        <p id="mensagem" role="status"></p>
        <p id="resumo" role="status" hidden></p>
    </main>
</body>
</html>
